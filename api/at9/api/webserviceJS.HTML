<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>





<button id="btn">

    Charger les musees

</button>

<div id="resultat"></div>

<script>




$(document).ready(function(){

    $("#btn").click(function(){

        $.ajax({

            url:"https://data.laregion.fr/api/explore/v2.1/catalog/datasets/agenda-d-occitanie-musees/records?limit=5",

            method:"GET",

            dataType:"json"

        })

        .done(function(rep){

            var html = "";

            html += "<table border='1' width='100%'>";

            html += "<tr>";

            html += "<th>Nom du lieu </th>";
            html += "<th>Ville</th>";
            
           

            html += "</tr>";



            for(var i=0 ; i<rep.results.length ; i++)
            {
                html += "<tr>";

                html += "<td>"
                        + rep.results[i].nom_du_lieu +
                        "</td>";

                html += "<td>"
                        + rep.results[i].ville +
                        "</td>";

              


                html += "</tr>";
            }



            html += "</table>";

            $("#resultat").html(html);

        })

        .fail(function(){

            alert("Erreur Service Web");

        });

    });

});

</script>
